name: Market Sentiment Telegram Bot

on:
  schedule:
    # 1. KST 06:25 (미국 장 마감 브리핑) ➔ UTC 21:25 (전날)
    - cron: '25 21 * * *'

    # 2. KST 08:00 (국장 개장 전 준비) ➔ UTC 23:02 (전날)
    - cron: '2 23 * * *'

    # 3. KST 15:30 (국장 마감 점검) ➔ UTC 06:30
    - cron: '30 6 * * *'

    # 4. KST 21:00 (미국 프리마켓) ➔ UTC 12:02
    - cron: '2 12 * * *'

    # 5. KST 23:00 (미국 본장 개장 전) ➔ UTC 14:02
    - cron: '2 14 * * *'

  workflow_dispatch: # 수동 테스트 실행 버튼

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests yfinance

      - name: Run Market Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ONCE: "true"
        run: python 심리지표+5대증시.py
