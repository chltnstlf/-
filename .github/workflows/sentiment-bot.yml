name: Market Sentiment & SOXL Alert Bot

on:
  schedule:
    # 1) 매일 한국시간 오전 9:00 (UTC 00:00) 일간 종합 브리핑
    - cron: '0 0 * * *'
    
    # 2) 미국 정규장 시간(한국시간 22:30 ~ 05:00 / UTC 13:30 ~ 20:00) 동안 1시간마다 장중 급락 감시
    - cron: '30 13,14,15,16,17,18,19,20 * * 1-5'

  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-path@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Market Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market_sentiment_bot.py
