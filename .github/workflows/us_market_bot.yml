name: US Market Sentiment Bot

on:
  schedule:
    # UTC 기준 08:00 ~ 01:00 (한국시간 17:00 ~ 다음날 10:00, 미국 프리/본장/애프터 시간 전체 커버)
    # 15분 간격 자동 실행
    - cron: '*/15 8-23 * * 1-5'
    - cron: '*/15 0-1 * * 2-6'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

jobs:
  run-us-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: 미국주식 감시 봇 1회 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ONCE: "true"
        run: python market_sentiment_bot.py
