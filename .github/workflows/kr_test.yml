name: KR Stock Test Bot

on:
  schedule:
    # 1. 한국시간 평일 08:00 ~ 08:50 (UTC 기준 일~목 23:00 ~ 23:50, 10분 간격)
    - cron: '*/10 23 * * 0-4'
    # 2. 한국시간 평일 09:00 ~ 15:30 (UTC 기준 월~금 00:00 ~ 06:30, 10분 간격)
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

jobs:
  run-kr-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: 국장 봇 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python kr_market_test.py
