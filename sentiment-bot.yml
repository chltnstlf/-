name: Market Sentiment Telegram Bot

on:
  schedule:
    # 매일 UTC 00:00 = 한국시간(KST, UTC+9) 오전 9시
    - cron: '0 0 * * *'
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼도 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 봇 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python market_sentiment_bot.py
